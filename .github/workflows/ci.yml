name: CI

# Single workflow file on purpose: AutoRelease AI's WF-0 ingest listens for
# one `workflow_run` "completed" event per commit and expects test + coverage
# + code-scanning results to all belong to that one run. Splitting this into
# multiple workflow files means multiple workflow_run events per sha and
# more correlation logic on the n8n side than the hackathon budget allows.
#
# The semantic-probe job below is a JOB, not a second workflow file, for
# exactly that reason. Its artifact is named `semantic-captures`; WF-0 filters
# artifacts by the exact name `test-results`, so ingest is unaffected by it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  security-events: write   # required for CodeQL + gitleaks SARIF upload
  actions: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # must match requirements.txt pin -- see its header comment

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with JUnit + coverage
        run: |
          pytest \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term
        # Intentionally NOT `continue-on-error` — a red run here is expected
        # and correct behavior for the flaky-test / regression demo scenarios.
        continue-on-error: true

      - name: Upload JUnit + coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          retention-days: 30

      - name: Fail job if tests failed
        run: |
          if [ -f reports/junit.xml ] && grep -q 'failures="0"' reports/junit.xml && grep -q 'errors="0"' reports/junit.xml; then
            echo "all tests passed"
          else
            echo "tests failed -- see reports/junit.xml"
            exit 1
          fi

  semantic-probe:
    # Captures the app's ACTUAL responses on both sides of the PR so
    # AutoRelease AI can compare behaviour, not just test outcomes. A green
    # suite only asserts what somebody thought to assert; this captures what
    # the app really returned.
    name: Semantic Response Probe
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need base history available locally to check it out below, and the
          # real head commit rather than the synthetic merge commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        continue-on-error: true

      - name: Stage the behaviour contract and checker from the BASE commit
        # The contract (probes.json) and its checker (tools/) are the rules this
        # PR is judged by, so they come from the BASE commit whenever it has
        # them: a PR cannot loosen the rules that judge it. If this PR edits
        # them, that is recorded and surfaced in the report. The first PR that
        # introduces the checker has no base copy, so it falls back to HEAD.
        # Both captures use the same staged copy, so they are always compared
        # under one set of rules. Staged in /tmp so checking out base later
        # cannot remove them.
        run: |
          mkdir -p /tmp/probe captures
          BASE=${{ github.event.pull_request.base.sha }}
          if git cat-file -e "$BASE:tools/invariants.py" 2>/dev/null && git cat-file -e "$BASE:probes.json" 2>/dev/null; then
            SOURCE=base
            git show "$BASE:probes.json" > /tmp/probe/probes.json
            git archive "$BASE" tools | tar -x -C /tmp/probe
          else
            SOURCE=head
            cp probes.json /tmp/probe/probes.json
            cp -r tools /tmp/probe/tools
          fi
          if git diff --quiet "$BASE" HEAD -- probes.json tools; then CHANGED=false; else CHANGED=true; fi
          echo "CONTRACT_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "CONTRACT_CHANGED=$CHANGED" >> "$GITHUB_ENV"
          echo "contract and checker taken from $SOURCE commit; modified in this PR: $CHANGED"
        continue-on-error: true

      - name: Capture HEAD responses
        run: python /tmp/probe/tools/probe_runner.py --probes /tmp/probe/probes.json --out captures/head_capture.json --label head --contract-source "$CONTRACT_SOURCE" --contract-changed "$CONTRACT_CHANGED"
        env:
          # Running a script by absolute path puts THAT script's directory on
          # sys.path, not the working directory, so `from app.main import app`
          # fails with ModuleNotFoundError. The runner lives in /tmp by design
          # (see the staging step), so the workspace has to be named explicitly.
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true

      - name: Check out the PR base commit
        run: git checkout --force ${{ github.event.pull_request.base.sha }}
        continue-on-error: true

      - name: Capture BASE responses
        run: python /tmp/probe/tools/probe_runner.py --probes /tmp/probe/probes.json --out captures/base_capture.json --label base --contract-source "$CONTRACT_SOURCE" --contract-changed "$CONTRACT_CHANGED"
        env:
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true

      - name: Record capture status
        # An absent artifact is ambiguous -- it could mean "nothing to report".
        # This writes the outcome down explicitly so a failed capture arrives as
        # data that says it failed, rather than as silence. It also guarantees
        # the upload below always has something to upload.
        if: always()
        run: |
          mkdir -p captures
          HEAD_OK=false; BASE_OK=false
          [ -f captures/head_capture.json ] && HEAD_OK=true
          [ -f captures/base_capture.json ] && BASE_OK=true
          printf '{"head_capture_present":%s,"base_capture_present":%s}\n' "$HEAD_OK" "$BASE_OK" > captures/CAPTURE_STATUS.json
          cat captures/CAPTURE_STATUS.json
          if [ "$HEAD_OK" != true ] || [ "$BASE_OK" != true ]; then
            echo "::warning::semantic probe incomplete -- AutoRelease AI will report the check as not run"
          fi

      - name: Upload captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-captures
          path: captures/
          retention-days: 30
        continue-on-error: true

      # NOTE ON continue-on-error: a missing capture must never be read as
      # "nothing diverged". That guarantee is enforced on the AutoRelease AI
      # side, which reports `semantic.available: false` and states plainly that
      # the check did not run. It is enforced there rather than here so that a
      # probe failure cannot flip this workflow's conclusion and corrupt the
      # flaky-test and regression scenarios that depend on it.

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (SARIF output)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
        continue-on-error: true   # never block CI itself; AutoRelease AI's
                                   # BLOCK gate is the enforcement point, not
                                   # this job's exit code.

      - name: Upload gitleaks SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          # VERIFY ON HOUR 0: confirm this is still the output filename for
          # the pinned gitleaks-action version before relying on it live --
          # check the action's current README/CHANGELOG.
          sarif_file: results.sarif
        continue-on-error: true
